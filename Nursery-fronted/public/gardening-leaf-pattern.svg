<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#c0e1bc"/>
  <g stroke="#085918" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.20">
    
    <!-- 1. Oval Ribbed Leaf (Top Left) -->
    <g transform="translate(30, 40) rotate(-20) scale(0.85)">
      <ellipse cx="40" cy="25" rx="35" ry="20" />
      <path d="M 5,25 L 75,25 M 25,25 L 15,10 M 40,25 L 30,8 M 55,25 L 45,10 M 25,25 L 15,40 M 40,25 L 30,42 M 55,25 L 45,40" />
    </g>

    <!-- 2. Circular Ribbed Leaf (Top Middle-Left) -->
    <g transform="translate(80, 65) scale(0.9)">
      <circle cx="30" cy="30" r="30" />
      <path d="M 30,0 L 30,60 M 30,15 L 10,25 M 30,30 L 8,40 M 30,45 L 15,52 M 30,15 L 50,25 M 30,30 L 52,40 M 30,45 L 45,52" />
    </g>

    <!-- 3. Pine-like Fern Frond (Top Right) -->
    <g transform="translate(160, 25) rotate(25) scale(0.8)">
      <path d="M 20,0 L 20,80" />
      <path d="M 20,10 L 5,20 M 20,20 L 2,32 M 20,30 L 0,44 M 20,40 L 2,56 M 20,50 L 5,68 M 20,60 L 8,76" />
      <path d="M 20,10 L 35,20 M 20,20 L 38,32 M 20,30 L 40,44 M 20,40 L 38,56 M 20,50 L 35,68 M 20,60 L 32,76" />
    </g>

    <!-- 4. Pointed Ribbed Leaf (Middle Right) -->
    <g transform="translate(170, 110) rotate(-15) scale(0.75)">
      <path d="M 0,25 Q 25,0 50,25 Q 25,50 0,25 Z" />
      <path d="M 0,25 L 50,25 M 15,25 L 5,12 M 30,25 L 20,10 M 15,25 L 5,38 M 30,25 L 20,40" />
    </g>

    <!-- 5. Berry Branch 1 (Center Curved) -->
    <g transform="translate(115, 120) rotate(-10) scale(0.85)">
      <path d="M 0,25 Q 40,10 80,0" />
      <circle cx="10" cy="28" r="6" fill="#c0e1bc" />
      <circle cx="30" cy="25" r="6" fill="#c0e1bc" />
      <circle cx="45" cy="15" r="6" fill="#c0e1bc" />
      <circle cx="68" cy="26" r="6" fill="#c0e1bc" />
    </g>

    <!-- 6. Berry Branch 2 (Diagonal Stem) -->
    <g transform="translate(200, 90) rotate(55) scale(0.85)">
      <path d="M 0,0 L 0,90" />
      <circle cx="-10" cy="20" r="6" fill="#c0e1bc" />
      <circle cx="10" cy="35" r="6" fill="#c0e1bc" />
      <circle cx="-8" cy="55" r="6" fill="#c0e1bc" />
      <circle cx="12" cy="70" r="6" fill="#c0e1bc" />
      <circle cx="-10" cy="85" r="6" fill="#c0e1bc" />
    </g>

    <!-- 7. Small Pointed Leaf (Far Left) -->
    <g transform="translate(5, 155) rotate(15) scale(0.65)">
      <path d="M 0,20 Q 20,0 40,20 Q 20,40 0,20 Z" />
      <path d="M 0,20 L 40,20 M 12,20 L 4,10 M 26,20 L 18,8 M 12,20 L 4,30 M 26,20 L 18,32" />
    </g>

    <!-- 8. Pine Frond (Bottom Left) -->
    <g transform="translate(45, 195) rotate(-65) scale(0.8)">
      <path d="M 20,0 L 20,80" />
      <path d="M 20,10 L 5,20 M 20,20 L 2,32 M 20,30 L 0,44 M 20,40 L 2,56 M 20,50 L 5,68" />
      <path d="M 20,10 L 35,20 M 20,20 L 38,32 M 20,30 L 40,44 M 20,40 L 38,56 M 20,50 L 35,68" />
    </g>

    <!-- 9. Pointed Ribbed Leaf (Bottom Center) -->
    <g transform="translate(175, 190) rotate(20) scale(0.8)">
      <path d="M 0,25 Q 25,0 50,25 Q 25,50 0,25 Z" />
      <path d="M 0,25 L 50,25 M 15,25 L 5,12 M 30,25 L 20,10 M 15,25 L 5,38 M 30,25 L 20,40" />
    </g>

    <!-- 10. Circular Leaf (Bottom Right Seamless Wrap) -->
    <g transform="translate(230, 245) scale(0.85)">
      <circle cx="30" cy="30" r="30" />
      <path d="M 30,0 L 30,60 M 30,15 L 10,25 M 30,30 L 8,40 M 30,45 L 15,52 M 30,15 L 50,25 M 30,30 L 52,40 M 30,45 L 45,52" />
    </g>

    <!-- Seamless Wraparound Corner / Edge Elements for Smooth Repeat -->
    <g transform="translate(230, -55) scale(0.85)">
      <circle cx="30" cy="30" r="30" />
      <path d="M 30,0 L 30,60 M 30,15 L 10,25 M 30,30 L 8,40 M 30,15 L 50,25 M 30,30 L 52,40" />
    </g>
    <g transform="translate(-70, 245) scale(0.85)">
      <circle cx="30" cy="30" r="30" />
      <path d="M 30,0 L 30,60 M 30,15 L 10,25 M 30,30 L 8,40 M 30,15 L 50,25 M 30,30 L 52,40" />
    </g>

    <!-- Accent Dots / Seeds -->
    <circle cx="80" cy="30" r="2.5" fill="#085918" stroke="none" />
    <circle cx="280" cy="30" r="2.5" fill="#085918" stroke="none" />
    <circle cx="15" cy="105" r="2.5" fill="#085918" stroke="none" />
    <circle cx="45" cy="200" r="2.5" fill="#085918" stroke="none" />
    <circle cx="210" cy="190" r="2.5" fill="#085918" stroke="none" />
    <circle cx="270" cy="170" r="2.5" fill="#085918" stroke="none" />
    <circle cx="155" cy="260" r="2.5" fill="#085918" stroke="none" />
  </g>
</svg>